<style>
:root{
  --bg:#ffffff; --fg:#1d2433; --muted:#5b6475; --line:#d9dde5; --panel:#ffffffee;
  --link:#0b57d0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#161a22; --fg:#e8ebf2; --muted:#9aa3b5; --line:#2c3342; --panel:#161a22ee; --link:#8ab4f8; }
}
:root[data-theme="dark"]{ --bg:#161a22; --fg:#e8ebf2; --muted:#9aa3b5; --line:#2c3342; --panel:#161a22ee; --link:#8ab4f8; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
h1{font-size:17px;margin:0 0 6px;font-weight:650}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.search{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 8px}
.search input{width:11em;max-width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.search button{padding:6px 12px;border:0;border-radius:6px;background:#0b57d0;color:#fff;font:inherit;font-size:14px;cursor:pointer}
.search .msg{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.35);display:inline-block}
.chip.off{opacity:.4;text-decoration:line-through}
#map{flex:1;min-height:0}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:600 12px/1 system-ui,sans-serif;padding:4px 6px;border-radius:5px;border:1px solid rgba(0,0,0,.45);box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer}
.tag.first::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:rgba(0,0,0,.55);border-bottom:0}
.leaflet-marker-icon:hover{z-index:100000 !important}
.pop h2{font-size:15px;margin:0 0 4px}
.pop table{border-collapse:collapse;margin:4px 0 8px}
.pop td{padding:1px 8px 1px 0;vertical-align:top;font-size:13px}
.pop td:first-child{color:#667085}
.pop a.btn{display:inline-block;background:#0b57d0;color:#fff;text-decoration:none;padding:6px 12px;border-radius:6px;font-size:13px}
@media (max-width:560px){ h1{font-size:15px} .sub{display:none} }
</style>

const UPDATED = "26.11.2026";

// Пять цветов, как в таблице: оценка цены к рынку
const BANDS = [
  {code:"B", label:"Сильно ниже рынка", bg:"#97d5f5"},
  {code:"Y", label:"Ниже рынка",        bg:"#ffd966"},
  {code:"G", label:"Рыночная цена",     bg:"#92c47c"},
  {code:"O", label:"Выше рынка",        bg:"#f6b16b"},
  {code:"R", label:"Сильно выше рынка", bg:"#df6666"},
  {code:"N", label:"Без оценки",        bg:"#ffffff"}
];
const bandOf = f => Math.max(0, BANDS.findIndex(b => b.code === f.color));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = p => { const m = Math.round(p/1e5)/10; return String(m).replace(".", ",") + " млн"; };
const rub = p => Math.round(p).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";

const map = L.map("map", {zoomControl:true}).setView([59.95, 30.33], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

// Квартиры в одном доме выставляем столбиком, чтобы подписи не слипались
const seen = {};
const layers = BANDS.map(() => L.layerGroup().addTo(map));
const counts = BANDS.map(() => 0);
const byNo = {};
const chips = [];

FLATS.forEach(f => {
  const key = f.lat.toFixed(5) + "," + f.lon.toFixed(5);
  const idx = seen[key] = (seen[key] ?? -1) + 1;
  const bi = bandOf(f); counts[bi]++;
  const b = BANDS[bi];
  const lift = 8 + idx * 22;
  const icon = L.divIcon({
    className: "",
    iconSize: [0, 0],
    html: `<div class="tag ${idx===0?"first":""}" style="background:${b.bg};color:#1b1b1b;transform:translate(-50%,calc(-100% - ${lift}px))">№${esc(f.no)} · ${short(f.price)}</div>`
  });
  const rows = [
    ["Адрес", f.addr], ["Район", f.district],
    ["Метро", f.metro + (f.walk ? ` (${f.walk} мин пешком)` : "")],
    ["Площадь", f.area + " м²"], ["Комнат", f.rooms], ["Этаж", f.floor],
    ["Цена за м²", f.ppm ? f.ppm + " ₽" : ""],
    ["Ремонт", f.cond], ["Парковка", f.parking], ["Дом", f.fund]
  ].filter(r => r[1]);
  const html = `<div class="pop"><h2>№${esc(f.no)} · ${rub(f.price)}</h2><table>` +
    rows.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("") +
    `</table>` + (f.link ? `<a class="btn" href="${esc(f.link)}" target="_blank" rel="noopener">Открыть объявление</a>` : "") + `</div>`;
  const marker = L.marker([f.lat, f.lon], {icon}).bindPopup(html, {maxWidth: 300}).addTo(layers[bi]);
  byNo[f.no] = {marker, bi};
});

// Легенда: нажатие скрывает или показывает группу
const legend = document.getElementById("legend");
BANDS.forEach((b, i) => {
  if (!counts[i]) { chips.push(null); return; }
  const el = document.createElement("button");
  el.className = "chip"; el.type = "button";
  el.innerHTML = `<i style="background:${b.bg}"></i>${b.label} · ${counts[i]}`;
  el.onclick = () => {
    const off = el.classList.toggle("off");
    off ? map.removeLayer(layers[i]) : map.addLayer(layers[i]);
  };
  chips.push(el);
  legend.appendChild(el);
});
document.getElementById("sub").textContent =
  `Всего ${FLATS.length}. Нажмите на подпись, чтобы увидеть подробности. Обновлено ${UPDATED}.`;

// Поиск по номеру квартиры из таблицы
document.getElementById("search").addEventListener("submit", e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const no = (document.getElementById("q").value.match(/\d+/) || [""])[0].replace(/^0+(?=\d)/, "");
  const hit = byNo[no];
  if (!no) { msg.textContent = "Введите номер"; return; }
  if (!hit) { msg.textContent = `Квартиры №${no} нет на карте`; return; }
  msg.textContent = "";
  if (!map.hasLayer(layers[hit.bi])) chips[hit.bi].click();   // эта группа была скрыта, включаем
  map.setView(hit.marker.getLatLng(), Math.max(map.getZoom(), 16), {animate: false});
  hit.marker.openPopup();
});

const pts = FLATS.map(f => [f.lat, f.lon]);
const fit = () => {
  map.invalidateSize();
  const sz = map.getSize();
  // если у карты ещё нет размера, оставляем обзор по умолчанию (центр города)
  if (sz.x < 50 || sz.y < 50 || !pts.length) return;
  map.fitBounds(L.latLngBounds(pts).pad(0.05), {animate:false});
};
fit();
window.addEventListener("load", fit);
window.addEventListener("resize", () => map.invalidateSize());
if (window.ResizeObserver) {
  let fitted = false;
  new ResizeObserver(() => { map.invalidateSize(); if (!fitted) { fitted = true; fit(); } }).observe(document.getElementById("map"));
}
setTimeout(fit, 300);
</script>
